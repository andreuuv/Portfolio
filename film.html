<html lang="en">
<meta charset="UTF-8">
<title>Film — Andreu Virgil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Selected film work by Andreu Virgil — director of photography.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://andreuvirgil.com/film.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Andreu Virgil">
<meta property="og:title" content="Film — Andreu Virgil">
<meta property="og:description" content="Selected film work by Andreu Virgil — director of photography.">
<meta property="og:url" content="https://andreuvirgil.com/film.html">
<meta property="og:image" content="https://andreuvirgil.com/assets/images/home-poster.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/webp" href="assets/images/favicon.webp">
<link rel="preload" href="assets/fonts/geist-mono/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/jetbrains-mono/JetBrainsMono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/film.css">
<script src="js/media-placeholder.js"></script>

<body class="film-page-body">

  <nav class="site-nav site-nav--light site-nav--grouped site-nav--corner site-nav--pin-viewport" aria-label="Primary">
    <a class="site-nav__brand site-nav__brand--grouped" href="index.html">Andreu Virgil</a>
    <div class="site-nav__links">
      <a href="film.html" aria-current="page">Cinematography</a>
      <a href="photography.html">Photography</a>
      <a href="info.html">About Me</a>
      <a href="tracklist.html">Index</a>
    </div>
    <button class="site-nav__menu-toggle" type="button" data-menu-open>Menu</button>
  </nav>

  <!-- Full-bleed background stage — always shows a project's preview clip
       (the "active" one: first project at rest, whichever row is
       hovered/focused otherwise), with the list overlaid directly on top
       instead of sitting in its own separate boxed column. Per reference
       ("la quiero asi la de slider"). -->
  <div class="film-stage" id="film-stage" aria-hidden="true">
    <video id="film-stage-video" muted loop playsinline autoplay preload="none"></video>
  </div>

  <div class="film-list-wrap">
    <div id="film-list" class="film-list"></div>
  </div>

  <!-- Director/Role of whichever project is currently active on the stage
       — same data already used elsewhere (data/projects.json), just
       surfaced here to match the reference's corner credit block. -->
  <div class="film-meta" id="film-meta">
    <p><span class="film-meta__label">Director</span> <span id="film-meta-director">—</span></p>
    <p><span class="film-meta__label">Role</span> <span id="film-meta-role">—</span></p>
  </div>

  <!-- Grid view — every project as a landscape thumbnail, all together
       (no category filter bar — tried and explicitly reverted, "quita
       las categorias...ponlos todos juntos"), alternative to the Slider
       (list + hover stage) above. -->
  <div class="film-grid-wrap" id="film-grid-wrap" hidden>
    <div class="film-grid" id="film-grid"></div>
  </div>

  <div class="film-view-toggle" role="tablist" aria-label="View">
    <button type="button" class="film-view-toggle__btn is-active" data-view="slider" role="tab" aria-selected="true">Slider</button>
    <button type="button" class="film-view-toggle__btn" data-view="grid" role="tab" aria-selected="false">Grid</button>
  </div>

  <!-- ============ Overlay menu (mobile nav + INDEX) ============ -->
  <div class="overlay-menu" id="overlay-menu" aria-hidden="true">
    <div class="overlay-menu__top">
      <a class="label" href="tracklist.html">Index</a>
      <button class="overlay-menu__close" type="button" data-menu-close>Close</button>
    </div>
    <div class="overlay-menu__body">
      <div>
        <div class="overlay-menu__group-title">Work</div>
        <div class="overlay-menu__links">
          <a href="film.html">Cinematography</a>
          <a href="photography.html">Photography</a>
        </div>
        <div class="overlay-menu__sub" id="index-film-list"></div>
      </div>
      <div>
        <div class="overlay-menu__group-title">Studio</div>
        <div class="overlay-menu__links">
          <a href="info.html">About Me</a>
          <a href="index.html">Home</a>
        </div>
      </div>
    </div>
    <div class="overlay-menu__bottom">
      <a href="mailto:andreu.virgil22@gmail.com">andreu.virgil22@gmail.com</a>
      <span>Barcelona · Available for international</span>
    </div>
  </div>

  <script src="js/film.js"></script>
  <script src="js/nav.js"></script>
  <script>
    fetch('data/projects.json').then(function (r) { return r.json(); }).then(function (projects) {
      var list = document.getElementById('index-film-list');
      if (!list) return;
      list.innerHTML = projects.map(function (p) {
        return '<a href="film-project.html?id=' + encodeURIComponent(p.id) + '">' + p.title + '</a>';
      }).join('');
    });
  </script>
</body>
